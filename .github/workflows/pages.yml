name: Build and sync public portal

on:
  push:
    branches: [main]
    paths:
      - "frameworks.yaml"
      - "catalog.yaml"
      - "relationships.yaml"
      - "resources.yaml"
      - "learning-paths.yaml"
      - "data/**/*.yaml"
      - "data/releases/*.json"
      - "schemas/**"
      - "examples/**"
      - "sdk/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-source-sync"
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Collect public upstream health signals
        run: python scripts/check_upstreams.py --json upstream-health.json --report upstream-health.md

      - name: Build measurement and research datasets
        run: |
          python scripts/aggregate_scorecards.py --output-dir generated-metrics
          python scripts/build_verification_queue.py --json verification-queue.json --report verification-queue.md
          python scripts/build_verification_v2.py --health upstream-health.json --output generated-metrics/verification-v2.json
          python scripts/build_knowledge_graph.py --output generated-metrics/knowledge-graph-v3.json
          python scripts/build_visual_intelligence.py --output generated-metrics/visual-intelligence.json
          python scripts/build_research_corpus.py --output generated-metrics/research-corpus.jsonl
          python scripts/check_standards.py --json standards-watch.json --report standards-watch.md

      - name: Build portal and API v4
        run: python scripts/build_site.py --output _site

      - name: Generate interoperability exports
        run: |
          python scripts/snapshot_catalog.py --version current --output _site/api/v3/snapshots/current.json
          python scripts/export_stix.py --output-dir _site/exports/stix
          python scripts/export_neo4j.py --output-dir _site/exports/neo4j
          python scripts/export_navigator.py --output _site/exports/attack-navigator/redframeworks-v5.json
          python scripts/export_misp.py --output _site/exports/misp/redframeworks-reference-event.json
          cp upstream-health.json _site/data/upstream-health.json
          cp standards-watch.json _site/data/standards-watch.json

      - name: Sync generated portal into branch-root Pages source
        run: python scripts/sync_pages_root.py --source _site --target .

      - name: Commit generated public portal
        shell: bash
        run: |
          git config user.name "redframeworks-pages-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html styles.css app.js detail.html detail.js assets api entity technique adversary exports graph planner intelligence data/*.json data/*.jsonl
          if git diff --cached --quiet; then
            echo "Public portal already synchronized."
            exit 0
          fi
          git commit -m "chore(pages): sync generated public portal"
          git push origin HEAD:main
