name: Build and deploy knowledge base
on:
  push:
    branches: [main]
    paths:
      - "frameworks.yaml"
      - "catalog.yaml"
      - "relationships.yaml"
      - "resources.yaml"
      - "learning-paths.yaml"
      - "data/**"
      - "schemas/**"
      - "examples/**"
      - "sdk/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Collect public upstream health signals
        run: python scripts/check_upstreams.py --json upstream-health.json --report upstream-health.md
      - name: Build measurement and research datasets
        run: |
          python scripts/aggregate_scorecards.py --output-dir generated-metrics
          python scripts/build_verification_queue.py --json verification-queue.json --report verification-queue.md
          python scripts/check_standards.py --json standards-watch.json --report standards-watch.md
      - name: Build dynamic OffSec portal and API v3
        run: python scripts/build_site.py --output _site
      - name: Generate v5 interoperability exports
        run: |
          python scripts/snapshot_catalog.py --version current --output _site/api/v3/snapshots/current.json
          python scripts/export_stix.py --output-dir _site/exports/stix
          python scripts/export_neo4j.py --output-dir _site/exports/neo4j
          python scripts/export_navigator.py --output _site/exports/attack-navigator/redframeworks-v5.json
          python scripts/export_misp.py --output _site/exports/misp/redframeworks-reference-event.json
      - name: Publish health and watcher data
        run: |
          cp upstream-health.json _site/data/upstream-health.json
          cp standards-watch.json _site/data/standards-watch.json
      - name: Force Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow \
            || echo "::warning::Pages settings could not be switched automatically; portable branch fallback remains available."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
