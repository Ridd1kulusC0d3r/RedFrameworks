name: Build and deploy knowledge base
on:
  push:
    branches: [main]
    paths:
      - "frameworks.yaml"
      - "catalog.yaml"
      - "relationships.yaml"
      - "data/**"
      - "schemas/**"
      - "examples/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Collect public upstream health signals
        run: python scripts/check_upstreams.py --json upstream-health.json --report upstream-health.md
      - name: Aggregate scorecards
        run: python scripts/aggregate_scorecards.py --output-dir generated-metrics
      - name: Probe standards versions
        run: python scripts/check_standards.py --json standards-watch.json --report standards-watch.md
      - name: Build catalog site, entity pages and API
        run: python scripts/build_site.py --output _site
      - name: Generate current reproducible snapshot
        run: python scripts/snapshot_catalog.py --version current --output _site/api/v2/snapshots/current.json
      - name: Generate STIX/OpenCTI export
        run: python scripts/export_stix.py --output-dir _site/api
      - name: Publish health and standards-watch datasets
        run: |
          cp upstream-health.json _site/data/upstream-health.json
          cp standards-watch.json _site/data/standards-watch.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
