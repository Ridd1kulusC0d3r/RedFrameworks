name: Upstream health review

on:
  schedule:
    - cron: "41 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Check canonical GitHub upstreams
        id: health
        shell: bash
        run: |
          python scripts/check_upstreams.py --json upstream-health.json --report upstream-health.md
          echo "actionable=$(python -c 'import json; print(json.load(open("upstream-health.json"))["actionable_count"])')" >> "$GITHUB_OUTPUT"
          cat upstream-health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update meaningful-change issue
        if: steps.health.outputs.actionable != '0'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const title = "[automation] Upstream lifecycle change detected";
            const body = "<!-- redframeworks-upstream-health -->\n" + fs.readFileSync("upstream-health.md", "utf8");
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state:"open", per_page:100});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
      - name: Close resolved lifecycle issue
        if: steps.health.outputs.actionable == '0'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "[automation] Upstream lifecycle change detected";
            const { data: issues } = await github.rest.issues.listForRepo({...context.repo, state:"open", per_page:100});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, state:"closed"});
