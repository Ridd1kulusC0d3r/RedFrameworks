name: Catalog contribution review

on:
  pull_request:
    paths:
      - "frameworks.yaml"
      - "catalog.yaml"
      - "relationships.yaml"
      - "schemas/**"
      - "examples/**"
      - "scripts/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  catalog-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Validate taxonomy, schemas and references
        run: |
          python scripts/validate_data.py
          python scripts/validate_examples.py
          python scripts/export_stix.py --output-dir _review-exports
      - name: Post internal PR review summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- redframeworks-catalog-review -->";
            const body = marker + "\n✅ Catalog review passed: schemas, unique IDs, relationship references, examples and STIX export are valid.";
            const { data: comments } = await github.rest.issues.listComments({...context.repo, issue_number:context.issue.number, per_page:100});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({...context.repo, comment_id:existing.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number:context.issue.number, body});
