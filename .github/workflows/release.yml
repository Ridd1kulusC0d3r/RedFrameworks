name: Versioned catalog release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Validate and build release assets
        run: |
          python scripts/validate_data.py
          python scripts/validate_examples.py
          python scripts/build_site.py --output _site-release
          python scripts/export_stix.py --output-dir exports
          tar -czf "redframeworks-${GITHUB_REF_NAME}.tar.gz" frameworks.yaml catalog.yaml relationships.yaml data schemas exports _site-release/api docs examples
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "redframeworks-${GITHUB_REF_NAME}.tar.gz" exports/*.json --generate-notes --title "RedFrameworks ${GITHUB_REF_NAME}"
