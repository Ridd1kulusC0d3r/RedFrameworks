name: Sync static Pages fallback

on:
  push:
    branches:
      - platform-v5-2-graph-redesign

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: platform-v5-2-graph-redesign
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Generate portable portal data
        run: |
          python scripts/aggregate_scorecards.py --output-dir generated-metrics
          python scripts/build_verification_queue.py --json verification-queue.json --report verification-queue.md
          python scripts/build_site.py --output _site-fallback
          rm -rf site/data
          mkdir -p site/data
          cp -R _site-fallback/data/. site/data/
      - name: Add branch-mode fallback entry points
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex">
            <title>RedFrameworks</title>
            <script>
              const target = "./site/" + location.search + location.hash;
              location.replace(target);
            </script>
          </head>
          <body>
            <p>Loading <a href="./site/">RedFrameworks</a>…</p>
          </body>
          </html>
          HTML
          touch .nojekyll
          mkdir -p graph
          cat > graph/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex">
            <title>RedFrameworks Graph</title>
            <script>location.replace("../site/graph/" + location.search + location.hash);</script>
          </head>
          <body><p>Loading <a href="../site/graph/">Graph Intelligence</a>…</p></body>
          </html>
          HTML
      - name: Commit generated fallback
        shell: bash
        run: |
          git config user.name "redframeworks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data index.html .nojekyll graph/index.html
          if git diff --cached --quiet; then
            echo "Fallback already synchronized."
            exit 0
          fi
          git commit -m "build: sync portable Pages fallback"
          git push origin HEAD:platform-v5-2-graph-redesign
