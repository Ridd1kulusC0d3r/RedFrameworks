name: Documentation quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --accept 200,204,206,429
            --exclude "https://attackflow\\.org/.*"
            --exclude "https://www\\.pentest-standard\\.org/.*"
            "**/*.md"
          fail: true
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Check browser JavaScript syntax
        run: node --check site/app.js
      - name: Validate schemas and cross-file integrity
        run: python scripts/validate_data.py
      - name: Validate machine-readable examples
        run: python scripts/validate_examples.py
      - name: Aggregate scorecards
        run: python scripts/aggregate_scorecards.py --output-dir generated-metrics
      - name: Generate reproducible snapshot
        run: python scripts/snapshot_catalog.py --version ci --output _snapshots/ci.json
      - name: Validate STIX / OpenCTI export
        run: python scripts/export_stix.py --output-dir _exports-test
      - name: Build browsable catalog and API v2
        run: python scripts/build_site.py --output _site-test
      - name: Validate generated JSON
        run: |
          python -m json.tool _site-test/api/version.json >/dev/null
          python -m json.tool _site-test/api/v2/catalog.json >/dev/null
          python -m json.tool _site-test/api/v2/relationships.json >/dev/null
          python -m json.tool _site-test/api/v2/standards.json >/dev/null
          python -m json.tool _site-test/data/coverage-series.json >/dev/null
          python -m json.tool _snapshots/ci.json >/dev/null
      - name: Validate freshness metadata
        run: python scripts/check_freshness.py --report freshness-report.md --json freshness-report.json
