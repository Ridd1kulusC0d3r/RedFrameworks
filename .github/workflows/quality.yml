name: Documentation quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --accept 200,204,206,429
            --exclude "https://attackflow\\.org/.*"
            --exclude "https://www\\.pentest-standard\\.org/.*"
            "**/*.md"
          fail: true
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Compile Python scripts and SDK
        run: |
          python -m compileall -q scripts sdk/python
          node --check site/app.js
          node --check site/detail.js
          node --check site/graph/graph.js
      - name: Validate canonical data and cross references
        run: |
          python scripts/validate_data.py
          python scripts/validate_examples.py
      - name: Build continuous intelligence artifacts
        run: |
          python scripts/aggregate_scorecards.py --output-dir generated-metrics
          python scripts/build_verification_queue.py --json verification-queue.json --report verification-queue.md
          python scripts/snapshot_catalog.py --version ci --output _snapshots/ci.json
      - name: Validate interoperability exports
        run: |
          python scripts/export_stix.py --output-dir _exports-test/stix
          python scripts/export_neo4j.py --output-dir _exports-test/neo4j
          python scripts/export_navigator.py --output _exports-test/attack-navigator.json
          python scripts/export_misp.py --output _exports-test/misp.json
      - name: Build OffSec portal and API v3
        run: python scripts/build_site.py --output _site-test
      - name: Validate generated API v3
        run: |
          python -m json.tool _site-test/api/version.json >/dev/null
          python -m json.tool _site-test/api/v3/index.json >/dev/null
          python -m json.tool _site-test/api/v3/catalog.json >/dev/null
          python -m json.tool _site-test/api/v3/resources.json >/dev/null
          python -m json.tool _site-test/api/v3/learning-paths.json >/dev/null
          python -m json.tool _site-test/api/v3/verification-queue.json >/dev/null
          python -m json.tool _site-test/api/v3/techniques.json >/dev/null
          python -m json.tool _site-test/api/v3/adversaries.json >/dev/null
          python -m json.tool _site-test/api/v3/intelligence-sources.json >/dev/null
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          index=json.load(open("_site-test/api/v3/index.json"))
          schema=json.load(open("schemas/api-v3-index.schema.json"))
          Draft202012Validator(schema).validate(index)
          item_schema=json.load(open("schemas/api-v3-item.schema.json"))
          validator=Draft202012Validator(item_schema)
          for item in json.load(open("_site-test/api/v3/catalog.json")):
              validator.validate(item)
          print("API v3 schemas: OK")
          PY
      - name: Validate freshness metadata
        run: python scripts/check_freshness.py --report freshness-report.md --json freshness-report.json
