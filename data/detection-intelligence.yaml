policy: "Detection hypotheses and telemetry requirements only. This dataset does not provide offensive execution procedures."

detections:
  - id: det-valid-accounts
    attack_id: "T1078"
    name: "Valid Accounts"
    telemetry: ["identity-provider sign-in logs", "VPN authentication", "cloud audit logs", "privilege changes"]
    analytics: ["unusual account context", "new device or location", "unexpected privilege use", "service-account interactive use"]
    evidence: ["source authentication event", "correlated identity alert", "analyst disposition", "containment record"]
    defensive_actions: ["model", "harden", "detect", "isolate", "evict", "restore"]
    source: "https://d3fend.mitre.org/offensive-technique/attack/T1078/"
    source_tier: "A"

